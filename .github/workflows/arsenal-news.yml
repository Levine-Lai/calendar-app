name: Update Arsenal news

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/arsenal-news.yml"
      - ".github/scripts/commit-and-push-with-rebase.sh"
      - "firebase/functions/arsenal-news-core.js"
      - "firebase/functions/update-arsenal-news.js"
      - "firebase/functions/translation-core.js"
      - "firebase/functions/package.json"
      - "firebase/functions/package-lock.json"
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: write

concurrency:
  group: team-news-updates
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install news worker
        run: npm ci --prefix firebase/functions

      - name: Fetch Arsenal.com sitemap and Guardian RSS
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Optional: without this secret the English feed still updates normally.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFER_NEWS_NOTIFICATIONS: "true"
          VALIDATE_FCM: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: npm run update:arsenal --prefix firebase/functions

      - name: Commit changed Arsenal news data
        shell: bash
        run: >-
          bash .github/scripts/commit-and-push-with-rebase.sh
          public/news/arsenal.json
          "chore: update Arsenal news"

      - name: Wait until the new Arsenal article is readable from GitHub Raw
        env:
          TEAM_NEWS_ID: arsenal
        run: npm run wait:published-news --prefix firebase/functions

      - name: Send Arsenal notifications for the published cache
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEWS_NOTIFY_ONLY: "true"
        run: npm run update:arsenal --prefix firebase/functions

      - name: Commit Arsenal notification queue state
        shell: bash
        run: >-
          bash .github/scripts/commit-and-push-with-rebase.sh
          public/news/arsenal.json
          "chore: confirm Arsenal notifications"
