name: Update Blue Jays news

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blue-jays-news.yml"
      - ".github/scripts/commit-and-push-with-rebase.sh"
      - "firebase/functions/**"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: team-news-updates
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install news worker
        run: npm ci --prefix firebase/functions

      - name: Fetch MLB news and prepare new-item notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEFER_NEWS_NOTIFICATIONS: "true"
          # Push-triggered runs validate credentials and payload without delivering a test notification.
          VALIDATE_FCM: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: npm run update:news --prefix firebase/functions

      - name: Commit changed news data
        shell: bash
        run: >-
          bash .github/scripts/commit-and-push-with-rebase.sh
          public/news/blue-jays.json
          "chore: update Blue Jays news"

      - name: Wait until the new article is readable from GitHub Raw
        run: npm run wait:published-news --prefix firebase/functions

      - name: Send notifications for the published cache
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEWS_NOTIFY_ONLY: "true"
        run: npm run update:news --prefix firebase/functions

      - name: Commit notification queue state
        shell: bash
        run: >-
          bash .github/scripts/commit-and-push-with-rebase.sh
          public/news/blue-jays.json
          "chore: confirm Blue Jays notifications"
