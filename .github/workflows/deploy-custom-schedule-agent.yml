name: Deploy custom schedule agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy Cloudflare Worker with DeepSeek secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_SCHEDULE_AI_API_KEY: ${{ secrets.CUSTOM_SCHEDULE_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CUSTOM_SCHEDULE_AI_API_KEY"
          secret_file="${RUNNER_TEMP}/custom-schedule-agent.secrets"
          printf 'CUSTOM_SCHEDULE_AI_API_KEY=%s\n' "$CUSTOM_SCHEDULE_AI_API_KEY" > "$secret_file"
          npx --yes wrangler@latest deploy \
            --config workers/custom-schedule-agent/wrangler.toml \
            --secrets-file "$secret_file"
          rm -f "$secret_file"
